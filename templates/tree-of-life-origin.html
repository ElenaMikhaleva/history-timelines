<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DF — Tree of Life template</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#F3ECDD; --ink:#1C1A15; --ink-soft:#5B564A;
  --paper:#F1ECDE; --paper-2:#E9E2CE; --border:1.5px; --radius:7px;
  --archean:#3E6E8E; --proterozoic:#7C8F4B; --merge:#8C5E7A;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans',sans-serif; line-height:1.6; }
.frame { max-width:720px; margin:0 auto; padding:56px 20px 100px; }
.kicker { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px; }
h1 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px,6vw,38px); margin:0 0 12px; }
.dek { font-size:15px; color:var(--ink-soft); max-width:34em; margin:0 0 12px; }
.legend { display:flex; gap:16px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:36px; align-items:center; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:16px; height:12px; border-radius:3px; display:inline-block; background:var(--paper); }
.legend .lg-rank i { border:1.5px solid var(--ink-soft); }
.legend .lg-lineage i { border:1.5px dashed var(--ink-soft); }
.legend .lg-event i { width:8px; height:8px; border-radius:50%; background:var(--merge); }

/* ---- Flow container: nodes are real HTML in normal document flow ---- */
.tree-flow { position:relative; }
.tree-links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; }
.tree-row { position:relative; z-index:1; display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:12px; margin-bottom:14px; }
.tree-col { display:flex; flex-direction:column; align-items:center; flex:1 1 0; min-width:0; max-width:220px; }

.node-btn {
  appearance:none; -webkit-appearance:none;
  font-family:'Fraunces', serif; font-weight:600; font-size:14.5px;
  background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--accent-color, var(--ink-soft));
  border-radius: var(--radius);
  padding: 10px 12px;
  cursor: pointer;
  min-height: 42px;
  min-width: 0;
  width: 100%;
  transition: background 0.15s ease, color 0.15s ease;
}
.node-btn.kind-lineage { border-style: dashed; }
.node-btn:hover { background: var(--paper-2); }
.node-btn.is-active { background: var(--accent-color, var(--ink-soft)); color: var(--cream); }
.node-btn:focus { outline: none; }
.node-btn:focus-visible { outline: 2px solid var(--accent-color, var(--ink-soft)); outline-offset: 2px; }

.sub-branch {
  margin-top: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}
.node-btn--small {
  font-size: 12px;
  padding: 7px 10px;
  min-height: 34px;
}

/* ---- Group wrap (informal grouping — real box, so no coordinate-math clash) ---- */
.group-wrap {
  position: relative;
  border: 1.5px dashed var(--group-color, var(--ink-soft));
  border-radius: 16px;
  padding: 20px 12px 14px;
  margin: 6px 0 14px;
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: flex-start;
  gap: 12px;
  z-index: 1;
}
.group-chip {
  appearance:none; -webkit-appearance:none;
  position: absolute;
  top: -13px; left: 50%;
  transform: translateX(-50%);
  background: var(--cream);
  border: 1.5px dashed var(--group-color, var(--ink-soft));
  color: var(--group-color, var(--ink-soft));
  border-radius: 999px;
  padding: 4px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  cursor: pointer;
}
.group-chip:hover, .group-chip.is-active { background: var(--group-color, var(--ink-soft)); color: var(--cream); }
.group-chip:focus { outline: none; }

/* ---- Event row (a merger/split event, clickable, sits between two node rows) ---- */
.event-row { position:relative; z-index:1; display:flex; justify-content:center; margin: -2px 0 16px; }
.event-chip-btn {
  appearance:none; -webkit-appearance:none;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--cream);
  border: 1.5px dashed var(--merge);
  color: var(--merge);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
}
.event-chip-btn:hover, .event-chip-btn.is-active { background: var(--merge); color: var(--cream); }
.event-chip-btn:focus { outline: none; }

/* ---- Expand panel: pushes content down, no floating/overlay ---- */
.expand-wrap {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.28s ease;
  width: 100%;
}
.expand-wrap.is-open { grid-template-rows: 1fr; }
.expand-inner { overflow: hidden; }
.expand-pad { padding-top: 14px; }

/* ---- Detail card: same system as your period cards ---- */
.period-card {
  background: var(--paper); border: var(--border) solid var(--ink-soft); border-radius: var(--radius);
  box-shadow: 6px 6px 0 var(--accent-color, var(--ink)); padding: 24px; text-align:left;
}
.period-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1.5px dashed var(--accent-color); padding-bottom:14px; margin-bottom:16px; }
.period-name { font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; }
.period-native { font-weight:400; color:var(--ink-soft); font-size:0.6em; font-family:'JetBrains Mono', monospace; margin-left:6px; }
.period-range { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--accent-color); border-radius:999px; padding:4px 11px; white-space:nowrap; background:color-mix(in srgb, var(--accent-color) 14%, transparent); }
.period-body { display:grid; grid-template-columns:1.3fr 1fr; gap:22px; align-items:start; }
.period-body.no-image { grid-template-columns:1fr; }
.period-text p { font-size:14.5px; margin:0 0 12px; }
.today-box { font-size:13px; border-left:2.5px solid var(--accent-color); padding:2px 0 2px 12px; color:var(--ink-soft); margin-top:6px; }
.today-box strong { color:var(--ink); font-weight:600; }

.highlight { text-decoration:underline; text-decoration-color:var(--accent-color); text-decoration-thickness:3px; text-underline-offset:4px; font-weight:500; }
.term {
  position: relative; background: color-mix(in srgb, var(--accent-color) 14%, transparent); color: var(--ink);
  font-family: 'JetBrains Mono', monospace; font-size: 0.86em; border-radius: 4px; padding: 1px 6px; cursor: help;
}
.term:hover, .term:focus, .term.is-open { background: color-mix(in srgb, var(--accent-color) 26%, transparent); }
.term:focus { outline:none; }
.term::after {
  content: attr(data-def); position: absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%) translateY(4px);
  width: max-content; max-width:200px; background:var(--ink); color:var(--cream);
  font-size:11px; line-height:1.4; padding:8px 10px; border-radius:6px;
  white-space:normal; text-align:left; opacity:0; pointer-events:none;
  transition:opacity 0.12s ease, transform 0.12s ease; z-index:10;
}
.term:hover::after, .term:focus::after, .term.is-open::after { opacity:1; transform:translateX(-50%) translateY(0); }

.carousel { position:relative; }
.carousel-viewport { position:relative; overflow:hidden; border:1.5px solid var(--ink-soft); border-radius:var(--radius); aspect-ratio:4/3; }
.carousel-track { display:flex; height:100%; transition:transform 0.3s ease; }
.carousel-slide { flex:0 0 100%; height:100%; margin:0; }
.carousel-slide .img-slot {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:repeating-linear-gradient(135deg, var(--paper-2), var(--paper-2) 8px, transparent 8px, transparent 16px);
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
}
.carousel-slide .img-slot img { width:100%; height:100%; object-fit:cover; display:block; }
.carousel-arrow {
  appearance:none; -webkit-appearance:none; box-sizing:border-box;
  position:absolute; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%;
  border:none; background:var(--cream); opacity:0.7; color:var(--ink); padding:0;
  display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:0;
  transition:opacity 0.15s ease, color 0.15s ease;
}
.carousel-arrow svg { width:11px; height:11px; display:block; }
.carousel-arrow:hover { opacity:1; color:var(--accent-color); }
.carousel-prev { left:8px; } .carousel-next { right:8px; }
.carousel-foot { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:8px; }
.carousel-dots { display:flex; gap:5px; flex-shrink:0; margin-top:3px; }
.carousel-dot {
  appearance:none; -webkit-appearance:none; display:block; box-sizing:border-box;
  width:5px; height:5px; border-radius:50%; background:var(--ink-soft); opacity:0.35;
  border:none; padding:0; margin:0; cursor:pointer; line-height:0;
}
.carousel-dot.is-active { background:var(--accent-color); opacity:1; }
.carousel-caption { font-size:11.5px; color:var(--ink-soft); line-height:1.4; min-height:2.8em; text-align:left; }

@media (max-width:520px) { .period-body { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <div class="kicker">Biology · Deep Time</div>
  <h1>Tree of Life: Origins</h1>
  <p class="dek">Tap any name to read its card right below it, or a dashed pill on a connector to read about that event.</p>
  <div class="legend">
    <span class="lg-rank"><i></i> formal rank</span>
    <span class="lg-lineage"><i></i> informal lineage</span>
    <span class="lg-event"><i></i> event</span>
  </div>

  <div class="tree-flow" id="treeFlow">
    <svg class="tree-links" id="treeLinks"></svg>
  </div>
</div>

<script>
/* =====================================================================
   REUSABLE TREE-OF-LIFE ENGINE (flow-based)
   To build a new page: copy this file, replace only TREE_DATA below.

   NODES — one entry per name in the diagram:
     id, name, native (optional), kind ("rank" solid border | "lineage" dashed),
     rankLabel (small badge, optional), color (era CSS var name),
     html (explanation — may use .highlight and .term spans),
     today (optional callout), images (optional array of {src, caption}
     — src is the image URL/path; leave it out and the card shows a
     placeholder tile, so you can add real images gradually)

   GROUPS — dashed bracket around several nodes (informal umbrella term):
     id, label, memberIds, color, name, native, html, today

   EVENTS — a clickable pill between two rows, e.g. a merger:
     id, label, from (array of parent node ids), to (child node id),
     color, name, html, today

   LAYOUT — the reading order, top to bottom. Only two entry types:
     { type:'row', items:[ {id, from?, sub?}, ... ], group?:'groupId' }
       — from (optional) draws a simple line from that parent, for
         items that sit as a peer in a different row
       — sub (optional, array of {id}) nests child nodes directly
         under THIS item in the same column, connected by a short
         line — use this instead of `from` when a node is a simple,
         non-merged child that shouldn't visually read as a peer of
         whatever else is in the row (e.g. a side-branch)
       — group (optional, on the row) wraps ALL items in that row in
         a dashed bracket referencing a GROUPS entry
     { type:'event', id:'eventId' }
       — draws lines from every event.from parent down to the chip,
         and from the chip down to event.to
   ===================================================================== */

const TREE_DATA = {
  nodes: [
    { id:'bacteria', name:'Bacteria', native:'Бактерии', kind:'rank', rankLabel:'domain', color:'archean',
      html:`<p>One of the two primary <span class="term" data-def="A group of related organisms sharing a common ancestor.">lineages</span> that split from early prokaryotic cells. Includes cyanobacteria — and, separately, the bacterium that would later merge permanently with an archaeon.</p>`,
      today:`Bacteria are found in essentially every environment on Earth, including inside you.` },

    { id:'archaea', name:'Archaea', native:'Археи', kind:'rank', rankLabel:'domain', color:'archean',
      html:`<p>The other primary prokaryote domain, genetically distinct from bacteria despite looking similar. Archaea are actually <span class="highlight">more closely related to eukaryotes</span> than bacteria are.</p>`,
      today:`Found almost everywhere, including the human gut — many are extremophiles, thriving in hot springs and salt lakes.` },

    { id:'cyanobacteria', name:'Cyanobacteria', native:'Цианобактерии', kind:'rank', rankLabel:'phylum', color:'archean',
      html:`<p>The first organisms to <span class="term" data-def="Using light energy to build sugars from CO₂ and water.">photosynthesize</span> using water, releasing oxygen as a byproduct and triggering the Great Oxidation Event.</p>`,
      today:`Still exist as "blue-green algae" — and a captured cyanobacterium became the chloroplast in every plant cell.`,
      images:[
        {src:'images/stromatolite-1.jpg', caption:'A stromatolite — layered mats built by cyanobacteria colonies.'},
        {caption:'Living stromatolites still grow today in Shark Bay, Australia.'}
      ] },

    { id:'eukaryotes', name:'Eukaryotes', native:'Эукариоты', kind:'rank', rankLabel:'domain', color:'proterozoic',
      html:`<p>Formed when an archaeon engulfed a bacterium and kept it as a permanent partner — the <span class="highlight">1st merger</span> below. That bacterium became the <span class="term" data-def="The organelle that generates a cell's energy.">mitochondrion</span>.</p>`,
      today:`The root of every plant, animal, fungus, and protist alive today — including you.` },

    { id:'algae', name:'Algae & plants', native:'Водоросли и растения', kind:'lineage', color:'proterozoic',
      html:`<p>A second, separate merger: one eukaryotic lineage engulfed a cyanobacterium, which became the <span class="term" data-def="The organelle that lets plant cells photosynthesize.">chloroplast</span> — the <span class="highlight">2nd merger</span> below.</p>`,
      today:`The ancestor of every alga and land plant alive.` },

    { id:'animalline', name:'Animal line', native:'Линия животных', kind:'lineage', color:'proterozoic',
      html:`<p>The eukaryote lineage that never acquired a chloroplast, staying dependent on consuming other organisms for energy.</p>`,
      today:`This branch eventually leads to animals — including every species in the Carnivora tree.` },

    { id:'ediacaran', name:'Ediacaran biota', native:'Эдиакарская биота', kind:'lineage', color:'proterozoic',
      html:`<p>Strange, soft-bodied, often frond-shaped organisms from the very end of the Proterozoic — among the first large, complex multicellular life. Whether they were true early animals is still debated.</p>`,
      today:`Sit right before the Cambrian explosion, where the animal kingdom bursts into full diversity.`,
      images:[
        {caption:'Dickinsonia — a flat, ribbed oval organism up to a meter long; still debated whether animal, fungus, or something else entirely.'},
        {caption:'Charnia — a stationary, frond-shaped organism, among the first Ediacaran fossils ever described.'},
        {caption:'Kimberella — bilaterally symmetric and mollusk-like, one of the strongest candidates for a true early animal.'},
        {caption:'Spriggina — a segmented, worm-like body plan, another candidate early animal.'}
      ] },
  ],

  groups: [
    { id:'prokaryotes', label:'Prokaryotes', memberIds:['bacteria','archaea'], color:'archean',
      name:'Prokaryotes', native:'Прокариоты',
      html:`<p>An informal umbrella term for cells with no nucleus — <span class="highlight">not a real branch of the tree</span>. Bacteria and Archaea had already diverged from each other by the time this word applies to either of them, so it's a description of a shared trait, not a common ancestor.</p>`,
      today:`Every bacterium and archaeon alive today is still, technically, a prokaryote — the term just describes what they lack, not who they descend from.` }
  ],

  events: [
    { id:'merger1', label:'1st merger', from:['bacteria','archaea'], to:'eukaryotes', color:'proterozoic',
      name:'Endosymbiosis — 1st merger',
      html:`<p>An archaeon engulfed a bacterium and, instead of digesting it, kept it as a permanent internal partner. This single event — called <span class="term" data-def="One organism living inside another, to their mutual benefit.">endosymbiosis</span> — is the root of every eukaryotic cell.</p>`,
      today:`That bacterium is still inside nearly every one of your own cells, as the mitochondrion that generates your energy.` },
    { id:'merger2', label:'2nd merger', from:['cyanobacteria','eukaryotes'], to:'algae', color:'proterozoic',
      name:'Endosymbiosis — 2nd merger',
      html:`<p>Later, and separately from the first merger, one eukaryotic lineage engulfed a cyanobacterium — which became the chloroplast.</p>`,
      today:`This is specifically why plants (and only plants) are green — the rest of the eukaryote tree never acquired this second merger.` },
  ],

  layout: [
    { type:'row', group:'prokaryotes', items:[ {id:'bacteria', sub:[{id:'cyanobacteria'}]}, {id:'archaea'} ] },
    { type:'event', id:'merger1' },
    { type:'row', items:[ {id:'eukaryotes'} ] },
    { type:'event', id:'merger2' },
    { type:'row', items:[ {id:'algae'}, {id:'animalline', from:'eukaryotes', sub:[{id:'ediacaran'}]} ] },
  ]
};

/* ---- Renderer — generic, do not need to edit this for a new page ---- */
const flow = document.getElementById('treeFlow');
const linksSvg = document.getElementById('treeLinks');
const nodesById = Object.fromEntries(TREE_DATA.nodes.map(n => [n.id, n]));
const groupsById = Object.fromEntries((TREE_DATA.groups||[]).map(g => [g.id, g]));
const eventsById = Object.fromEntries((TREE_DATA.events||[]).map(e => [e.id, e]));
const simpleLinks = []; // {fromId, toId} for plain single-parent connectors

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function buildCarousel(images) {
  const slides = images.map((img, i) => `
    <figure class="carousel-slide" data-caption="${(img.caption||'').replace(/"/g,'&quot;')}">
      <div class="img-slot">${img.src ? `<img src="${img.src}" alt="${(img.caption||'').replace(/"/g,'&quot;')}">` : `image ${i+1}`}</div>
    </figure>`).join('');
  return `<div class="carousel"><div class="carousel-viewport"><div class="carousel-track">${slides}</div>
    <button class="carousel-arrow carousel-prev" aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="carousel-arrow carousel-next" aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div><div class="carousel-foot"><div class="carousel-caption"></div><div class="carousel-dots"></div></div></div>`;
}
function wireCarousel(root) {
  root.querySelectorAll('.carousel').forEach(carousel => {
    const track = carousel.querySelector('.carousel-track');
    const slides = Array.from(carousel.querySelectorAll('.carousel-slide'));
    const captionEl = carousel.querySelector('.carousel-caption');
    const dotsWrap = carousel.querySelector('.carousel-dots');
    let index = 0;
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i===0 ? ' is-active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);
    function goTo(i) {
      index = (i + slides.length) % slides.length;
      track.style.transform = `translateX(-${index*100}%)`;
      dots.forEach((d,di) => d.classList.toggle('is-active', di===index));
      captionEl.textContent = slides[index].dataset.caption || '';
    }
    carousel.querySelector('.carousel-prev').addEventListener('click', () => goTo(index-1));
    carousel.querySelector('.carousel-next').addEventListener('click', () => goTo(index+1));
    let startX = 0;
    track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 40) goTo(index-1); else if (dx < -40) goTo(index+1);
    });
    goTo(0);
  });
}

function cardHtml(item, badge) {
  const hasImages = item.images && item.images.length;
  return `
    <div class="expand-pad">
      <section class="period-card" style="--accent-color:var(--${item.color})">
        <div class="period-head">
          <h3 class="period-name">${item.name}${item.native ? `<span class="period-native">${item.native}</span>` : ''}</h3>
          ${badge ? `<span class="period-range">${badge}</span>` : ''}
        </div>
        <div class="period-body ${hasImages ? '' : 'no-image'}">
          <div class="period-text">
            ${item.html}
            ${item.today ? `<div class="today-box"><strong>Today:</strong> ${item.today}</div>` : ''}
          </div>
          ${hasImages ? buildCarousel(item.images) : ''}
        </div>
      </section>
    </div>`;
}

const globalExpand = document.createElement('div');
globalExpand.className = 'expand-wrap';
globalExpand.innerHTML = '<div class="expand-inner"></div>';
let activeId = null;

function toggleExpand(id, btn, item, badge, anchorEl) {
  const inner = globalExpand.querySelector('.expand-inner');
  const wasOpenForThis = globalExpand.classList.contains('is-open') && activeId === id;

  document.querySelectorAll('.node-btn.is-active, .group-chip.is-active, .event-chip-btn.is-active').forEach(b => b.classList.remove('is-active'));

  if (wasOpenForThis) {
    globalExpand.classList.remove('is-open');
    activeId = null;
    globalExpand.addEventListener('transitionend', () => { inner.innerHTML = ''; redrawLinks(); }, { once:true });
  } else {
    inner.innerHTML = cardHtml(item, badge);
    wireCarousel(inner);
    anchorEl.insertAdjacentElement('afterend', globalExpand);
    requestAnimationFrame(() => globalExpand.classList.add('is-open'));
    btn.classList.add('is-active');
    activeId = id;
    globalExpand.addEventListener('transitionend', redrawLinks, { once:true });
  }
  redrawLinks();
  setTimeout(redrawLinks, 320);
}

function buildNodeCol(item, anchorRow) {
  const n = nodesById[item.id];
  const col = document.createElement('div');
  col.className = 'tree-col';
  col.dataset.nodeId = n.id;
  const btn = document.createElement('button');
  btn.className = `node-btn kind-${n.kind}`;
  btn.style.setProperty('--accent-color', `var(--${n.color})`);
  btn.dataset.id = n.id;
  btn.textContent = n.name;
  btn.addEventListener('click', () => toggleExpand(n.id, btn, n, n.rankLabel || null, anchorRow));
  col.appendChild(btn);
  if (item.from) simpleLinks.push({ fromId:item.from, toId:n.id });

  if (item.sub && item.sub.length) {
    const subWrap = document.createElement('div');
    subWrap.className = 'sub-branch';
    item.sub.forEach(subItem => {
      const subN = nodesById[subItem.id];
      const subBtn = document.createElement('button');
      subBtn.className = `node-btn node-btn--small kind-${subN.kind}`;
      subBtn.style.setProperty('--accent-color', `var(--${subN.color})`);
      subBtn.dataset.id = subN.id;
      subBtn.textContent = subN.name;
      subBtn.addEventListener('click', () => toggleExpand(subN.id, subBtn, subN, subN.rankLabel || null, anchorRow));
      subWrap.appendChild(subBtn);
      simpleLinks.push({ fromId:item.id, toId:subN.id });
    });
    col.appendChild(subWrap);
  }
  return col;
}

TREE_DATA.layout.forEach(entry => {
  if (entry.type === 'row') {
    const rowEl = document.createElement('div');
    rowEl.className = 'tree-row';

    if (entry.group) {
      const g = groupsById[entry.group];
      const wrap = document.createElement('div');
      wrap.className = 'group-wrap';
      wrap.style.setProperty('--group-color', `var(--${g.color})`);
      const chip = document.createElement('button');
      chip.className = 'group-chip';
      chip.textContent = g.label;
      chip.dataset.id = g.id;
      chip.addEventListener('click', () => toggleExpand(g.id, chip, g, 'informal group', rowEl));
      wrap.appendChild(chip);
      entry.items.forEach(item => wrap.appendChild(buildNodeCol(item, rowEl)));
      rowEl.appendChild(wrap);
    } else {
      entry.items.forEach(item => rowEl.appendChild(buildNodeCol(item, rowEl)));
    }
    flow.appendChild(rowEl);
  }

  if (entry.type === 'event') {
    const ev = eventsById[entry.id];
    const evRow = document.createElement('div');
    evRow.className = 'event-row';
    const chip = document.createElement('button');
    chip.className = 'event-chip-btn';
    chip.textContent = '?';
    chip.title = ev.label;
    chip.setAttribute('aria-label', ev.label);
    chip.dataset.id = ev.id;
    chip.addEventListener('click', () => toggleExpand(ev.id, chip, ev, 'event', evRow));
    evRow.appendChild(chip);
    flow.appendChild(evRow);
  }
});

/* ---- Connector lines: computed from real DOM positions, redrawn on any layout change ---- */
function redrawLinks() {
  const flowRect = flow.getBoundingClientRect();
  linksSvg.innerHTML = '';
  linksSvg.setAttribute('width', flowRect.width);
  linksSvg.setAttribute('height', flowRect.height);

  function centerOf(el, edge) {
    const r = el.getBoundingClientRect();
    return { x: r.left - flowRect.left + r.width/2, y: (edge==='bottom' ? r.bottom : r.top) - flowRect.top };
  }
  function drawLine(p1, p2, dashed) {
    const path = svgEl('path', {
      d:`M${p1.x},${p1.y} C${p1.x},${(p1.y+p2.y)/2} ${p2.x},${(p1.y+p2.y)/2} ${p2.x},${p2.y}`,
      fill:'none', stroke: dashed ? 'var(--merge)' : 'var(--ink-soft)', 'stroke-width':'1.5'
    });
    if (dashed) path.setAttribute('stroke-dasharray', '4 4');
    linksSvg.appendChild(path);
  }

  simpleLinks.forEach(l => {
    const from = document.querySelector(`.node-btn[data-id="${l.fromId}"]`);
    const to = document.querySelector(`.node-btn[data-id="${l.toId}"]`);
    if (from && to) drawLine(centerOf(from,'bottom'), centerOf(to,'top'), false);
  });

  (TREE_DATA.events||[]).forEach(ev => {
    const chip = document.querySelector(`.event-chip-btn[data-id="${ev.id}"]`);
    if (!chip) return;
    ev.from.forEach(fid => {
      const from = document.querySelector(`.node-btn[data-id="${fid}"]`);
      if (from) drawLine(centerOf(from,'bottom'), centerOf(chip,'top'), true);
    });
    const to = document.querySelector(`.node-btn[data-id="${ev.to}"]`);
    if (to) drawLine(centerOf(chip,'bottom'), centerOf(to,'top'), true);
  });
}

redrawLinks();
window.addEventListener('resize', redrawLinks);
document.addEventListener('click', (e) => {
  if (!e.target.closest('.node-btn, .group-chip, .event-chip-btn, .expand-wrap')) {
    if (globalExpand.classList.contains('is-open')) {
      globalExpand.classList.remove('is-open');
      activeId = null;
      globalExpand.addEventListener('transitionend', () => { globalExpand.querySelector('.expand-inner').innerHTML = ''; redrawLinks(); }, { once:true });
    }
    document.querySelectorAll('.is-active').forEach(b => b.classList.remove('is-active'));
    setTimeout(redrawLinks, 320);
  }
});
</script>
