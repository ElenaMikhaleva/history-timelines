<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DF — Species tree template</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#F3ECDD; --ink:#1C1A15; --ink-soft:#5B564A;
  --paper:#F1ECDE; --paper-2:#E9E2CE; --border:1.5px; --radius:7px;
  --amber:#C68A3E; --slate:#3D5A73; --rust:#C1502E;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans',sans-serif; line-height:1.6; }
.frame { max-width:900px; margin:0 auto; padding:56px 20px 100px; }
.kicker { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:14px; }
h1 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px,6vw,38px); margin:0 0 12px; }
.dek { font-size:15px; color:var(--ink-soft); max-width:34em; margin:0 0 28px; }

/* ---- Horizontal flow: stages arranged left to right, each a vertical stack ---- */
.tree-flow { position:relative; display:flex; flex-direction:row; align-items:stretch; gap:34px; overflow-x:auto; padding:6px 4px 10px; }
.tree-links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; }
.stage { position:relative; z-index:1; display:flex; flex-direction:column; justify-content:space-around; gap:12px; flex:0 0 auto; }
.stage-col { display:flex; flex-direction:column; align-items:center; width:150px; }

.node-btn {
  appearance:none; -webkit-appearance:none;
  font-family:'Fraunces', serif; font-weight:600; font-size:14px;
  background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--accent-color, var(--ink-soft));
  border-radius: var(--radius);
  padding: 9px 10px;
  cursor: pointer;
  min-height: 40px;
  min-width: 0;
  width: 100%;
  transition: background 0.15s ease, color 0.15s ease;
}
.node-btn.kind-lineage { border-style: dashed; }
.node-btn:hover { background: var(--paper-2); }
.node-btn.is-active { background: var(--accent-color, var(--ink-soft)); color: var(--cream); }
.node-btn:focus { outline: none; }
.node-btn:focus-visible { outline: 2px solid var(--accent-color, var(--ink-soft)); outline-offset: 2px; }

/* ---- Shared detail card area, full width, below the diagram ---- */
.detail-zone { margin-top: 8px; }
.expand-wrap { display:grid; grid-template-rows:0fr; transition:grid-template-rows 0.28s ease; width:100%; }
.expand-wrap.is-open { grid-template-rows:1fr; }
.expand-inner { overflow:hidden; }
.expand-pad { padding-top:6px; }

.period-card {
  background: var(--paper); border: var(--border) solid var(--ink-soft); border-radius: var(--radius);
  box-shadow: 6px 6px 0 var(--accent-color, var(--ink)); padding: 24px; text-align:left;
}
.period-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1.5px dashed var(--accent-color); padding-bottom:14px; margin-bottom:16px; }
.period-name { font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; }
.period-native { font-weight:400; color:var(--ink-soft); font-size:0.6em; font-family:'JetBrains Mono', monospace; margin-left:6px; }
.period-range { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--accent-color); border-radius:999px; padding:4px 11px; white-space:nowrap; background:color-mix(in srgb, var(--accent-color) 14%, transparent); }
.period-body { display:grid; grid-template-columns:1.3fr 1fr; gap:22px; align-items:start; }
.period-body.no-image { grid-template-columns:1fr; }
.period-text p { font-size:14.5px; margin:0 0 12px; }
.today-box { font-size:13px; border-left:2.5px solid var(--accent-color); padding:2px 0 2px 12px; color:var(--ink-soft); margin-top:6px; }
.today-box strong { color:var(--ink); font-weight:600; }

.highlight { text-decoration:underline; text-decoration-color:var(--accent-color); text-decoration-thickness:3px; text-underline-offset:4px; font-weight:500; }
.term {
  position: relative; background: color-mix(in srgb, var(--accent-color) 14%, transparent); color: var(--ink);
  font-family: 'JetBrains Mono', monospace; font-size: 0.86em; border-radius: 4px; padding: 1px 6px; cursor: help;
}
.term:hover, .term:focus, .term.is-open { background: color-mix(in srgb, var(--accent-color) 26%, transparent); }
.term:focus { outline:none; }
.term::after {
  content: attr(data-def); position: absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%) translateY(4px);
  width: max-content; max-width:200px; background:var(--ink); color:var(--cream);
  font-size:11px; line-height:1.4; padding:8px 10px; border-radius:6px;
  white-space:normal; text-align:left; opacity:0; pointer-events:none;
  transition:opacity 0.12s ease, transform 0.12s ease; z-index:10;
}
.term:hover::after, .term:focus::after, .term.is-open::after { opacity:1; transform:translateX(-50%) translateY(0); }

.carousel { position:relative; }
.carousel-viewport { position:relative; overflow:hidden; border:1.5px solid var(--ink-soft); border-radius:var(--radius); aspect-ratio:4/3; }
.carousel-track { display:flex; height:100%; transition:transform 0.3s ease; }
.carousel-slide { flex:0 0 100%; height:100%; margin:0; }
.carousel-slide .img-slot {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:repeating-linear-gradient(135deg, var(--paper-2), var(--paper-2) 8px, transparent 8px, transparent 16px);
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
}
.carousel-slide .img-slot img { width:100%; height:100%; object-fit:cover; display:block; }
.carousel-arrow {
  appearance:none; -webkit-appearance:none; box-sizing:border-box;
  position:absolute; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%;
  border:none; background:var(--cream); opacity:0.7; color:var(--ink); padding:0;
  display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:0;
  transition:opacity 0.15s ease, color 0.15s ease;
}
.carousel-arrow svg { width:11px; height:11px; display:block; }
.carousel-arrow:hover { opacity:1; color:var(--accent-color); }
.carousel-prev { left:8px; } .carousel-next { right:8px; }
.carousel-foot { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:8px; }
.carousel-dots { display:flex; gap:5px; flex-shrink:0; margin-top:3px; }
.carousel-dot {
  appearance:none; -webkit-appearance:none; display:block; box-sizing:border-box;
  width:5px; height:5px; border-radius:50%; background:var(--ink-soft); opacity:0.35;
  border:none; padding:0; margin:0; cursor:pointer; line-height:0;
}
.carousel-dot.is-active { background:var(--accent-color); opacity:1; }
.carousel-caption { font-size:11.5px; color:var(--ink-soft); line-height:1.4; min-height:2.8em; text-align:left; }

@media (max-width:520px) { .period-body { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <div class="kicker">Biology · Taxonomy</div>
  <h1>Carnivora: Species Tree</h1>
  <p class="dek">No timeline here — just how the order splits into families. Scroll sideways if it doesn't fit, tap any name for its card.</p>

  <div class="tree-flow" id="treeFlow">
    <svg class="tree-links" id="treeLinks"></svg>
  </div>
  <div class="detail-zone" id="detailZone"></div>
</div>

<script>
/* =====================================================================
   REUSABLE SPECIES-TREE ENGINE (horizontal — for pages with no eras,
   just taxonomy). Copy this file and replace only TREE_DATA to build
   a new page.

   NODES: id, name, native?, kind ("rank" solid border | "lineage" dashed),
     rankLabel?, color, html, today?, images? (array of {src?, caption})

   LAYOUT: an ordered array of stages, left to right:
     { type:'stage', items:[ {id, from?}, ... ] }
       — from = parent node id, draws a connector line to it.
         Omit `from` only for the root stage (nothing to connect to).
   ===================================================================== */

const TREE_DATA = {
  nodes: [
    { id:'carnivora', name:'Carnivora', native:'Хищные', kind:'rank', rankLabel:'order', color:'rust',
      html:`<p>Defined by shearing <span class="term" data-def="Blade-like teeth adapted for shearing meat rather than grinding it.">carnassial teeth</span> — not diet alone, since some carnivorans (like the giant panda) are largely vegetarian.</p>`,
      today:`~290 living species, split into two suborders distinguished by the shape of their ear bones.` },

    { id:'feliformia', name:'Feliformia', native:'Кошкообразные', kind:'rank', rankLabel:'suborder', color:'amber',
      html:`<p>The <span class="highlight">catlike</span> carnivorans — cats, hyenas, mongooses, and civets.</p>`,
      today:`Found on every continent except Antarctica and (naturally) Australia.` },

    { id:'caniformia', name:'Caniformia', native:'Собакообразные', kind:'rank', rankLabel:'suborder', color:'slate',
      html:`<p>The <span class="highlight">doglike</span> carnivorans — a more species-rich branch, including dogs, bears, weasels, seals, and raccoons.</p>`,
      today:`Includes the most species-rich carnivoran family of all: Mustelidae.` },

    { id:'felidae', name:'Felidae', native:'кошки', kind:'rank', rankLabel:'family', color:'amber',
      html:`<p>Lions, tigers, cheetahs, and the domestic cat. Nearly all species have retractile claws.</p>`, today:`41 living species.` },
    { id:'hyaenidae', name:'Hyaenidae', native:'гиены', kind:'rank', rankLabel:'family', color:'amber',
      html:`<p>Spotted, striped, and brown hyena, plus the termite-eating aardwolf — more closely related to cats and mongooses than to dogs.</p>`, today:`4 living species.` },
    { id:'herpestidae', name:'Herpestidae', native:'мангусты', kind:'rank', rankLabel:'family', color:'amber',
      html:`<p>Small, agile hunters across Africa and southern Asia. The meerkat, one of the most social species here, lives in this family.</p>`, today:`~34 living species.` },
    { id:'viverridae', name:'Viverridae', native:'виверровые', kind:'rank', rankLabel:'family', color:'amber',
      html:`<p>Mostly nocturnal, tree-dwelling hunters of the Old World tropics — among the closest living relatives to the ancestral carnivoran body plan.</p>`, today:`~30 living species.` },

    { id:'canidae', name:'Canidae', native:'псовые', kind:'rank', rankLabel:'family', color:'slate',
      html:`<p>Wolves, foxes, jackals, and the domestic dog. Found on every continent except Antarctica.</p>`, today:`~37 living species.` },
    { id:'ursidae', name:'Ursidae', native:'медвежьи', kind:'rank', rankLabel:'family', color:'slate',
      html:`<p>The largest living carnivorans. Includes the giant panda, whose bamboo diet is a striking exception to the order's meat-shearing teeth.</p>`, today:`8 living species.` },
    { id:'mustelidae', name:'Mustelidae', native:'куньи', kind:'rank', rankLabel:'family', color:'slate',
      html:`<p>The most species-rich carnivoran family of all — weasels, otters, badgers, and wolverines.</p>`, today:`~60 living species.` },
    { id:'pinnipedia', name:'Pinnipedia', native:'ластоногие', kind:'lineage', color:'slate',
      html:`<p>Fully aquatic caniforms descended from bear-like ancestors — true seals, eared seals, and the walrus. Shown as an informal grouping here rather than a single formal family.</p>`, today:`~33 living species.` },
    { id:'procyonidae', name:'Procyonidae', native:'енотовые', kind:'rank', rankLabel:'family', color:'slate',
      html:`<p>Raccoons, coatis, and kinkajous — mostly found in the Americas.</p>`, today:`~14 living species.` },
  ],

  layout: [
    { type:'stage', items:[ {id:'carnivora'} ] },
    { type:'stage', items:[ {id:'feliformia', from:'carnivora'}, {id:'caniformia', from:'carnivora'} ] },
    { type:'stage', items:[
        {id:'felidae', from:'feliformia'}, {id:'hyaenidae', from:'feliformia'}, {id:'herpestidae', from:'feliformia'}, {id:'viverridae', from:'feliformia'},
        {id:'canidae', from:'caniformia'}, {id:'ursidae', from:'caniformia'}, {id:'mustelidae', from:'caniformia'}, {id:'pinnipedia', from:'caniformia'}, {id:'procyonidae', from:'caniformia'}
      ] },
  ]
};

/* ---- Renderer ---- */
const flow = document.getElementById('treeFlow');
const linksSvg = document.getElementById('treeLinks');
const detailZone = document.getElementById('detailZone');
const nodesById = Object.fromEntries(TREE_DATA.nodes.map(n => [n.id, n]));
const simpleLinks = [];

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function buildCarousel(images) {
  const slides = images.map((img, i) => `
    <figure class="carousel-slide" data-caption="${(img.caption||'').replace(/"/g,'&quot;')}">
      <div class="img-slot">${img.src ? `<img src="${img.src}" alt="${(img.caption||'').replace(/"/g,'&quot;')}">` : `image ${i+1}`}</div>
    </figure>`).join('');
  return `<div class="carousel"><div class="carousel-viewport"><div class="carousel-track">${slides}</div>
    <button class="carousel-arrow carousel-prev" aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button class="carousel-arrow carousel-next" aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div><div class="carousel-foot"><div class="carousel-caption"></div><div class="carousel-dots"></div></div></div>`;
}
function wireCarousel(root) {
  root.querySelectorAll('.carousel').forEach(carousel => {
    const track = carousel.querySelector('.carousel-track');
    const slides = Array.from(carousel.querySelectorAll('.carousel-slide'));
    const captionEl = carousel.querySelector('.carousel-caption');
    const dotsWrap = carousel.querySelector('.carousel-dots');
    let index = 0;
    slides.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i===0 ? ' is-active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });
    const dots = Array.from(dotsWrap.children);
    function goTo(i) {
      index = (i + slides.length) % slides.length;
      track.style.transform = `translateX(-${index*100}%)`;
      dots.forEach((d,di) => d.classList.toggle('is-active', di===index));
      captionEl.textContent = slides[index].dataset.caption || '';
    }
    carousel.querySelector('.carousel-prev').addEventListener('click', () => goTo(index-1));
    carousel.querySelector('.carousel-next').addEventListener('click', () => goTo(index+1));
    let startX = 0;
    track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 40) goTo(index-1); else if (dx < -40) goTo(index+1);
    });
    goTo(0);
  });
}

function cardHtml(item, badge) {
  const hasImages = item.images && item.images.length;
  return `
    <div class="expand-pad">
      <section class="period-card" style="--accent-color:var(--${item.color})">
        <div class="period-head">
          <h3 class="period-name">${item.name}${item.native ? `<span class="period-native">${item.native}</span>` : ''}</h3>
          ${badge ? `<span class="period-range">${badge}</span>` : ''}
        </div>
        <div class="period-body ${hasImages ? '' : 'no-image'}">
          <div class="period-text">
            ${item.html}
            ${item.today ? `<div class="today-box"><strong>Today:</strong> ${item.today}</div>` : ''}
          </div>
          ${hasImages ? buildCarousel(item.images) : ''}
        </div>
      </section>
    </div>`;
}

const globalExpand = document.createElement('div');
globalExpand.className = 'expand-wrap';
globalExpand.innerHTML = '<div class="expand-inner"></div>';
detailZone.appendChild(globalExpand);
let activeId = null;

function toggleExpand(id, btn, item, badge) {
  const inner = globalExpand.querySelector('.expand-inner');
  const wasOpenForThis = globalExpand.classList.contains('is-open') && activeId === id;
  document.querySelectorAll('.node-btn.is-active').forEach(b => b.classList.remove('is-active'));

  if (wasOpenForThis) {
    globalExpand.classList.remove('is-open');
    activeId = null;
    globalExpand.addEventListener('transitionend', () => { inner.innerHTML = ''; redrawLinks(); }, { once:true });
  } else {
    inner.innerHTML = cardHtml(item, badge);
    wireCarousel(inner);
    globalExpand.classList.add('is-open');
    btn.classList.add('is-active');
    activeId = id;
    setTimeout(() => globalExpand.scrollIntoView({ behavior:'smooth', block:'start' }), 60);
  }
  redrawLinks();
  setTimeout(redrawLinks, 320);
}

TREE_DATA.layout.forEach(entry => {
  const stageEl = document.createElement('div');
  stageEl.className = 'stage';
  entry.items.forEach(item => {
    const n = nodesById[item.id];
    const col = document.createElement('div');
    col.className = 'stage-col';
    const btn = document.createElement('button');
    btn.className = `node-btn kind-${n.kind}`;
    btn.style.setProperty('--accent-color', `var(--${n.color})`);
    btn.dataset.id = n.id;
    btn.textContent = n.name;
    btn.addEventListener('click', () => toggleExpand(n.id, btn, n, n.rankLabel || null));
    col.appendChild(btn);
    stageEl.appendChild(col);
    if (item.from) simpleLinks.push({ fromId:item.from, toId:n.id });
  });
  flow.appendChild(stageEl);
});

/* ---- Connector lines: left-edge-of-child to right-edge-of-parent ---- */
function redrawLinks() {
  const flowRect = flow.getBoundingClientRect();
  linksSvg.innerHTML = '';
  linksSvg.setAttribute('width', flowRect.width);
  linksSvg.setAttribute('height', flowRect.height);

  function edgeOf(el, side) {
    const r = el.getBoundingClientRect();
    return { x: (side==='right' ? r.right : r.left) - flowRect.left, y: r.top - flowRect.top + r.height/2 };
  }
  function drawLine(p1, p2) {
    const path = svgEl('path', {
      d:`M${p1.x},${p1.y} C${(p1.x+p2.x)/2},${p1.y} ${(p1.x+p2.x)/2},${p2.y} ${p2.x},${p2.y}`,
      fill:'none', stroke:'var(--ink-soft)', 'stroke-width':'1.5'
    });
    linksSvg.appendChild(path);
  }
  simpleLinks.forEach(l => {
    const from = document.querySelector(`.node-btn[data-id="${l.fromId}"]`);
    const to = document.querySelector(`.node-btn[data-id="${l.toId}"]`);
    if (from && to) drawLine(edgeOf(from,'right'), edgeOf(to,'left'));
  });
}

redrawLinks();
window.addEventListener('resize', redrawLinks);
</script>
</body>
</html>
