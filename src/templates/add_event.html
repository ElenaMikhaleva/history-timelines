<!DOCTYPE html>
<html>
<head>
    <title>Timeline Form</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form-container {
            padding: 24px;
            width: 320px;
        }
        label {
            font-weight: bold;
        }
        input, select, textarea, button {
            width: 100%;
            margin-top: 6px;
        }
        button {
            margin-top: 16px;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Add event</h1>

    <form method="POST">
        <label>Name</label><br>
        <input  name="name" required><br><br>

        <label>Start date</label><br>
        <input name="start_date" required><br><br>

        <label>End date</label><br>
        <input  name="end_date" required><br><br>

        <label>Description</label><br>
        <input  name="descr" required><br><br>

        <button>Save</button>
    </form><br><br>
    <a href="{{ url_for('home') }}">Back to timelines</a>
</div>

</body>
</html>
